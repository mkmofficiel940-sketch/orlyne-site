<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORLYNE CHECK BAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --accent-red: #d32f2f;
            --accent-glow: rgba(211, 47, 47, 0.4);
            --text-main: #f5f5f5;
            --text-sub: #a0a0a0;
            --whatsapp-green: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .brand-sub {
            font-size: 0.7rem;
            color: var(--accent-red);
            letter-spacing: 1px;
        }

        main {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 20px 0;
        }

        .profile-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid var(--accent-red);
            box-shadow: 0 0 20px var(--accent-glow);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .motto {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 25px;
            font-style: italic;
        }
        .wa-btn-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .wa-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 1px solid var(--whatsapp-green);
            color: var(--whatsapp-green);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .wa-btn:hover {
            background-color: var(--whatsapp-green);
            color: #000;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="tel"]:focus {
            border-color: var(--accent-red);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .submit-btn:hover {
            background-color: #b71c1c;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .status-clean {
            background-color: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .status-banned {
            background-color: rgba(211, 47, 47, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }

        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-sub);
            letter-spacing: 1px;
            text-align: center;
        }

        footer strong {
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="brand-title">ORLYNE CHECK BAN</div>
            <div class="brand-sub">FREE CHECK</div>
        </div>
    </header>

    <main>
        <div class="profile-container">
            <img src="https://i.ibb.co/Lhbv0P8P/Screenshot-20260906-141241.png" alt="Orlyne Bot Logo">
        </div>

        <p class="motto">"Work hard, never give up and pray. One day, it will pay off."</p>

        <div class="wa-btn-container">
            <a href="https://whatsapp.com/channel/0029VbAwnNUBvvslMVmnNU1C" target="_blank" class="wa-btn">
                📢 Rejoindre notre Chaîne WhatsApp
            </a>
        </div>

        <div class="card">
            <form id="checkForm">
                <div class="input-group">
                    <label for="phone">NUMÉRO DE TÉLÉPHONE (AVEC INDICATIF)</label>
                    <input type="tel" id="phone" placeholder="+2250700000000" required>
                </div>
                <button type="submit" class="submit-btn" id="btnText">VÉRIFIER LE STATUT</button>
            </form>

            <div id="result"></div>
        </div>
    </main>

    <footer>
        DEV BY <strong>PRIME KOBA LA D AND IZANA</strong>
    </footer>

    <script>
        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value.trim();
            const resultDiv = document.getElementById('result');
            const btnText = document.getElementById('btnText');

            if (!phone) return;

            btnText.innerText = "VÉRIFICATION EN COURS...";
            resultDiv.style.display = "none";

            try {
                const response = await fetch('/check-numberr2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: phone })
                });

                const data = await response.json();

                resultDiv.style.display = "block";
                if (data.banned) {
                    resultDiv.className = "status-banned";
                    resultDiv.innerHTML = "<strong>Statut : BANNI ❌</strong><br>Ce numéro présente une restriction sur WhatsApp.";
                } else {
                    resultDiv.className = "status-clean";
                    resultDiv.innerHTML = "<strong>Statut : NON BANNI ✅</strong><br>Ce numéro est valide et en bon état.";
                }
            } catch (error) {
                resultDiv.style.display = "block";
                resultDiv.className = "status-banned";
                resultDiv.innerHTML = "<strong>Erreur ⚠️</strong><br>Impossible d'effectuer la vérification pour le moment.";
            } finally {
                btnText.innerText = "VÉRIFIER LE STATUT";
            }
        });
    </script>
</body>
</html>
