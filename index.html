<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORLYNE - CHECK BAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0c10;
            background-image: radial-gradient(circle at center, rgba(220, 38, 38, 0.15) 0%, transparent 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            background: rgba(22, 22, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff3b5c;
            box-shadow: 0 0 25px rgba(255, 59, 92, 0.4);
            background: #000;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ff3b5c;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a0a0ab;
            margin-bottom: 22px;
        }

        .channel-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.8rem;
            color: #d1d1d6;
            text-align: left;
            margin-bottom: 24px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-box a {
            color: #25d366;
            text-decoration: none;
            font-weight: 600;
        }

        .input-group {
            text-align: left;
            margin-bottom: 8px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #d1d1d6;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff3b5c;
            box-shadow: 0 0 12px rgba(255, 59, 92, 0.3);
        }

        .input-hint {
            font-size: 0.72rem;
            color: #71717a;
            text-align: left;
            margin-bottom: 22px;
            margin-top: 6px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff3b5c 0%, #e11d48 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 59, 92, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        #result {
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            display: none;
            text-align: left;
        }

        .status-banned {
            background: rgba(255, 59, 92, 0.12);
            border: 1px solid rgba(255, 59, 92, 0.3);
            color: #ff4d6d;
        }

        .status-clean {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .result-detail {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #a0a0ab;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 6px;
        }

        .footer-text {
            margin-top: 28px;
            font-size: 0.75rem;
            color: #71717a;
            letter-spacing: 0.5px;
        }

        .footer-text strong {
            color: #ff3b5c;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-container">
            <img src="https://files.catbox.moe/8b04u8.png" alt="Orlyne Bot Logo" onerror="this.src='https://i.ibb.co/6803Y30/orlyne.png'">
        </div>

        <h1 class="title">ORLYNE-CHECK-BAN</h1>
        <p class="subtitle">Vérifie le statut de n'importe quel numéro WhatsApp</p>

        <div class="channel-box">
            📢 <span>Rejoins notre <a href="https://whatsapp.com/channel/0029VbAwnNUBvvslMVmnNU1C" target="_blank">Chaîne WhatsApp</a> pour ne pas rater les nouvelles mises à jour.</span>
        </div>

        <form id="checkForm">
            <div class="input-group">
                <label for="phone">Numéro WhatsApp</label>
                <input type="tel" id="phone" placeholder="+22770000000" required>
            </div>
            <p class="input-hint">Inclus l'indicatif pays (ex: +227 pour le Niger)</p>

            <button type="submit" class="submit-btn" id="btnText">
                🔍 Vérifier le statut
            </button>
        </form>

        <div id="result"></div>

        <div class="footer-text">
            Développé par <strong>PRIME KOBA LA D × ♔I Z Ā N Ā♔</strong>
        </div>
    </div>

    <script>
        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value.trim();
            const resultDiv = document.getElementById('result');
            const btnText = document.getElementById('btnText');

            if (!phone) return;

            btnText.innerText = "Vérification en cours...";
            btnText.style.opacity = "0.7";
            resultDiv.style.display = "none";

            try {
                const response = await fetch('/check-numberr2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: phone })
                });

                const data = await response.json();
                const now = new Date().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'medium' });

                resultDiv.style.display = "block";
                
                if (data.banned) {
                    resultDiv.className = "status-banned";
                    const banDate = data.bannedDate || data.banTime || data.date || "Information non transmise par WhatsApp";

                    resultDiv.innerHTML = `
                        <strong>Statut : THIS NUMBER CANNOT LONGER USE WHATSAPP ❌</strong><br>
                        <span>Ce numéro ne peut plus utuliser whatsapp.</span>
                        <div class="result-detail">
                            📍 <strong>Date du ban :</strong> ${banDate}<br>
                            🕒 <strong>Vérifié le :</strong> ${now}
                        </div>
                    `;
                } else {
                    resultDiv.className = "status-clean";
                    resultDiv.innerHTML = `
                        <strong>Statut : THIS NUMBER IS AVAILAIBLE ON WHATSAPP ✅</strong><br>
                        <span>Ce numéro est toujours vivant.</span>
                        <div class="result-detail">
                            🕒 <strong>Vérifié le :</strong> ${now}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.style.display = "block";
                resultDiv.className = "status-banned";
                resultDiv.innerHTML = "<strong>Erreur ⚠️</strong><br>Impossible de contacter le serveur de vérification.";
            } finally {
                btnText.innerHTML = "🔍 Vérifier le statut";
                btnText.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
